version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haze
      POSTGRES_PASSWORD: haze
      POSTGRES_DB: haze
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haze"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ""
    volumes:
      - meilidata:/meili_data

  gateway:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  auth:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.auth
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  chat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.chat
    ports:
      - "8082:8082"
    environment:
      CHAT_PORT: "8082"
      DATABASE_URL: postgres://haze:haze@postgres:5432/haze?sslmode=disable
      JWT_SECRET: change-me-in-production
      SERVICE_SEARCH: http://search:8087
      SERVICE_NOTIFICATION: http://notification:8086
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - ./backend/configs:/configs

  media:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.media
    ports:
      - "8083:8083"
    environment:
      MEDIA_PORT: "8083"
      MEDIA_STORAGE: minio
      DATABASE_URL: postgres://haze:haze@postgres:5432/haze?sslmode=disable
      JWT_SECRET: change-me-in-production
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: haze-media
      MINIO_USE_SSL: "false"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  call:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.call
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  bot:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.bot
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  notification:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.notification
    ports:
      - "8086:8086"
    environment:
      NOTIF_PORT: "8086"
      DATABASE_URL: postgres://haze:haze@postgres:5432/haze?sslmode=disable
      JWT_SECRET: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  search:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.search
    ports:
      - "8087:8087"
    environment:
      SEARCH_PORT: "8087"
      DATABASE_URL: postgres://haze:haze@postgres:5432/haze?sslmode=disable
      JWT_SECRET: change-me-in-production
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ""
    depends_on:
      - meilisearch
    volumes:
      - ./backend/configs:/configs

  premium:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.premium
    ports:
      - "8088:8088"
    environment:
      PREMIUM_PORT: "8088"
      DATABASE_URL: postgres://haze:haze@postgres:5432/haze?sslmode=disable
      JWT_SECRET: change-me-in-production
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafanadata:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/loki
    command: -config.file=/etc/loki/local-config.yaml

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway

volumes:
  pgdata:
  miniodata:
  meilidata:
  promdata:
  grafanadata:
  lokidata: