version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haze
      POSTGRES_PASSWORD: haze
      POSTGRES_DB: haze
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haze"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Read-реплика для GET-запросов (горячий standby).
  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haze
      POSTGRES_PASSWORD: haze
      POSTGRES_DB: haze
      PGPASSWORD: haze
    command: /bin/sh /standby.sh
    volumes:
      - replicadata:/var/lib/postgresql/data
      - ./deploy/postgres/standby.sh:/standby.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haze"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Пул подключений: много клиентов, мало коннектов к Postgres.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: haze
      DB_PASSWORD: haze
      DB_NAME: haze
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: plain
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # Ежедневный бэкап pg_dump в отдельный том.
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: haze
    command: /bin/sh -c "while true; do pg_dump -h postgres -U haze haze | gzip > /backups/haze_$(date +%F).sql.gz; echo backup done $(date); sleep 86400; done"
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ""
    volumes:
      - meilidata:/meili_data

  gateway:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  auth:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.auth
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  chat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.chat
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - ./backend/configs:/configs

  media:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.media
    ports:
      - "8083:8083"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  call:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.call
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      REDIS_ADDR: redis:6379
      REDIS_DB: "1"
      TURN_URL: turn:coturn:3478?transport=udp
      TURN_USERNAME: haze
      TURN_PASSWORD: haze
    volumes:
      - ./backend/configs:/configs

  # TURN-сервер для WebRTC (звонки за NAT). Статические учётки haze/haze.
  coturn:
    image: coturn/coturn
    restart: unless-stopped
    command:
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=haze.local"
      - "--user=haze:haze"
      - "--no-cli"
      - "--log-file=stdout"
    network_mode: host

  bot:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.bot
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  notification:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.notification
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  search:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.search
    ports:
      - "8087:8087"
    depends_on:
      - meilisearch
    volumes:
      - ./backend/configs:/configs

  premium:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.premium
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/configs:/configs

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafanadata:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/loki
    command: -config.file=/etc/loki/local-config.yaml

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway

volumes:
  pgdata:
  replicadata:
  backups:
  miniodata:
  meilidata:
  promdata:
  grafanadata:
  lokidata: